name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"  # nightly live evaluation
  workflow_dispatch:

jobs:
  # [start:verify]
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halden"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HALDEN_DSN: postgresql://halden:halden@localhost:5432/halden
    steps:
      - uses: actions/checkout@v7
      - name: Create the application role (not a superuser)
        run: psql -v ON_ERROR_STOP=1 -f docker/initdb/01-app-role.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: halden
      - uses: astral-sh/setup-uv@v7
      - name: Cache open-weight models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}
      - name: Install
        run: uv sync --all-extras
      - name: Lint, type-check, test
        run: uv run python scripts/verify.py
      - name: Build the index from the sample sources
        run: |
          uv run python scripts/migrate.py
          for s in manuals policies contracts tickets; do
            uv run python scripts/ingest.py data/sources/$s $s
          done
      - name: Retrieval evaluation gate
        run: >-
          uv run python scripts/eval.py
          --baseline eval/baseline.json
      - name: Run examples against the demo index
        run: |
          uv run python scripts/load_demo_index.py
          uv run python -m examples.ch10_compare_retrievers
  # [end:verify]

  # [start:image]
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t halden:${{ github.sha }} .
      - name: Smoke test
        run: >-
          docker run --rm halden:${{ github.sha }}
          python -c "import halden.api.app"
      - name: Push (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --password-stdin \
              -u "${{ github.actor }}"
          image=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag halden:${{ github.sha }} "${image,,}"
          docker push "${image,,}"
  # [end:image]

  # [start:live-eval]
  live-eval:
    # Costs money and depends on a provider: nightly or on demand,
    # never on every push, and never on pull requests from forks.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halden"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HALDEN_DSN: postgresql://halden:halden@localhost:5432/halden
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HALDEN_MODEL: claude-sonnet-5
      HALDEN_JUDGE_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v7
      - name: Create the application role (not a superuser)
        run: psql -v ON_ERROR_STOP=1 -f docker/initdb/01-app-role.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: halden
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - name: Build the index
        run: |
          uv run python scripts/migrate.py
          for s in manuals policies contracts tickets; do
            uv run python scripts/ingest.py data/sources/$s $s
          done
      - name: Full evaluation with judge
        run: >-
          uv run python scripts/eval.py --mode full --rerank
          --floors eval/floors_full.json --out eval-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results.json
  # [end:live-eval]
